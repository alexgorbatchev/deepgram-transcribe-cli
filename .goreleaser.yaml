version: 2

project_name: deepgram-transcribe-cli

builds:
  - id: deepgram-transcribe
    main: ./cmd/deepgram-transcribe
    binary: deepgram-transcribe
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    # Named after the binary, and carrying the version, so that the download
    # command in the README is a single predictable URL.
    name_template: "deepgram-transcribe_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
